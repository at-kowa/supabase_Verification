<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タスク管理表</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #656d76;
      --line: #d0d7de; --accent: #0969da; --danger: #cf222e;
      --todo: #eaeef2; --doing: #fff1c2; --done: #d4f4dd;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font-family: "Yu Gothic UI", "Meiryo", sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    form.add { display: grid; grid-template-columns: 1fr 130px 100px 150px auto; gap: 8px; }
    input, select, textarea, button { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
    button { cursor: pointer; background: var(--card); }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.danger { color: var(--danger); }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { color: var(--muted); font-weight: normal; font-size: 13px; }
    tr.status-done td.title { text-decoration: line-through; color: var(--muted); }
    td.status select[data-status="todo"] { background: var(--todo); }
    td.status select[data-status="doing"] { background: var(--doing); }
    td.status select[data-status="done"] { background: var(--done); }
    .overdue { color: var(--danger); font-weight: bold; }
    .message { padding: 8px 12px; border-radius: 6px; margin-bottom: 16px; display: none; }
    .message.error { display: block; background: #ffebe9; color: var(--danger); }
    .empty { color: var(--muted); text-align: center; padding: 24px; }
    @media (max-width: 720px) {
      form.add { grid-template-columns: 1fr 1fr; }
      form.add input[name="title"] { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
<main>
  <h1>タスク管理表</h1>
  <div id="message" class="message"></div>

  <section class="card">
    <form class="add" id="add-form">
      <input name="title" placeholder="タスク名（業務の内容は書かないでください）" maxlength="200" required>
      <input name="due_date" type="date" title="期限">
      <select name="priority" title="優先度">
        <option value="1">優先度 高</option>
        <option value="2" selected>優先度 中</option>
        <option value="3">優先度 低</option>
      </select>
      <select name="status" title="状態">
        <option value="todo" selected>未着手</option>
        <option value="doing">進行中</option>
        <option value="done">完了</option>
      </select>
      <button class="primary" type="submit">追加</button>
    </form>
  </section>

  <section class="card">
    <div class="toolbar">
      <label>表示：
        <select id="filter">
          <option value="active" selected>未完了のみ</option>
          <option value="all">すべて</option>
          <option value="todo">未着手</option>
          <option value="doing">進行中</option>
          <option value="done">完了</option>
        </select>
      </label>
      <label>並び順：
        <select id="sort">
          <option value="due" selected>期限が近い順</option>
          <option value="priority">優先度順</option>
          <option value="created">登録が新しい順</option>
        </select>
      </label>
      <span id="count" style="color: var(--muted)"></span>
    </div>
    <table>
      <thead>
        <tr><th>タスク</th><th>状態</th><th>優先度</th><th>期限</th><th></th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </section>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  const TABLE = "practice03_tasks";
  const STATUS_LABEL = { todo: "未着手", doing: "進行中", done: "完了" };
  const PRIORITY_LABEL = { 1: "高", 2: "中", 3: "低" };

  const messageEl = document.getElementById("message");
  const listEl = document.getElementById("list");
  const countEl = document.getElementById("count");
  const filterEl = document.getElementById("filter");
  const sortEl = document.getElementById("sort");

  function showError(text) {
    messageEl.textContent = text;
    messageEl.className = "message error";
  }
  function clearError() {
    messageEl.textContent = "";
    messageEl.className = "message";
  }

  if (!window.APP_CONFIG || window.APP_CONFIG.SUPABASE_URL.includes("xxxx")) {
    showError("config.js が見つからないか、設定が書かれていません。config.example.js をコピーして config.js を作ってください。");
    throw new Error("config.js missing");
  }
  const db = supabase.createClient(window.APP_CONFIG.SUPABASE_URL, window.APP_CONFIG.SUPABASE_ANON_KEY);

  let tasks = [];

  async function load() {
    const { data, error } = await db.from(TABLE).select("*");
    if (error) return showError("読み込みに失敗しました：" + error.message);
    clearError();
    tasks = data;
    render();
  }

  function sorted(items) {
    const byDue = (a, b) => (a.due_date || "9999-12-31").localeCompare(b.due_date || "9999-12-31");
    const sorters = {
      due: (a, b) => byDue(a, b) || a.priority - b.priority,
      priority: (a, b) => a.priority - b.priority || byDue(a, b),
      created: (a, b) => b.created_at.localeCompare(a.created_at),
    };
    return [...items].sort(sorters[sortEl.value]);
  }

  function visible() {
    const f = filterEl.value;
    if (f === "all") return tasks;
    if (f === "active") return tasks.filter(t => t.status !== "done");
    return tasks.filter(t => t.status === f);
  }

  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    Object.assign(node, props);
    for (const c of children) node.append(c);
    return node;
  }

  function options(labels, current) {
    return Object.entries(labels).map(([value, label]) =>
      el("option", { value, textContent: label, selected: String(current) === value }));
  }

  function render() {
    const now = new Date();
    const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    const items = sorted(visible());
    countEl.textContent = `${items.length} 件`;
    listEl.replaceChildren();
    if (items.length === 0) {
      listEl.append(el("tr", {}, [el("td", { colSpan: 5, className: "empty", textContent: "タスクはありません" })]));
      return;
    }
    for (const t of items) {
      const statusSel = el("select", {}, options(STATUS_LABEL, t.status));
      statusSel.dataset.status = t.status;
      statusSel.onchange = () => update(t.id, { status: statusSel.value });

      const prioritySel = el("select", {}, options(PRIORITY_LABEL, t.priority));
      prioritySel.onchange = () => update(t.id, { priority: Number(prioritySel.value) });

      const dueInput = el("input", { type: "date", value: t.due_date || "" });
      if (t.due_date && t.due_date < today && t.status !== "done") dueInput.className = "overdue";
      dueInput.onchange = () => update(t.id, { due_date: dueInput.value || null });

      const titleCell = el("td", { className: "title", textContent: t.title, title: "ダブルクリックで編集" });
      titleCell.ondblclick = () => {
        const next = prompt("タスク名", t.title);
        if (next && next.trim() && next !== t.title) update(t.id, { title: next.trim() });
      };

      const delBtn = el("button", { className: "danger", textContent: "削除" });
      delBtn.onclick = () => { if (confirm(`「${t.title}」を削除しますか？`)) remove(t.id); };

      listEl.append(el("tr", { className: `status-${t.status}` }, [
        titleCell,
        el("td", { className: "status" }, [statusSel]),
        el("td", {}, [prioritySel]),
        el("td", {}, [dueInput]),
        el("td", {}, [delBtn]),
      ]));
    }
  }

  async function update(id, fields) {
    const { error } = await db.from(TABLE).update(fields).eq("id", id);
    if (error) return showError("更新に失敗しました：" + error.message);
    await load();
  }

  async function remove(id) {
    const { error } = await db.from(TABLE).delete().eq("id", id);
    if (error) return showError("削除に失敗しました：" + error.message);
    await load();
  }

  document.getElementById("add-form").onsubmit = async (e) => {
    e.preventDefault();
    const form = e.target;
    const f = form.elements;
    const row = {
      title: f.title.value.trim(),
      due_date: f.due_date.value || null,
      priority: Number(f.priority.value),
      status: f.status.value,
    };
    if (!row.title) return;
    const { error } = await db.from(TABLE).insert(row);
    if (error) return showError("追加に失敗しました：" + error.message);
    form.reset();
    await load();
  };

  filterEl.onchange = render;
  sortEl.onchange = render;
  load();
</script>
</body>
</html>
