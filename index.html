<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>備品メモ（検証用）</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>備品メモ（検証用）</h1>
      <p class="note">※テストデータのみ入力してください。</p>

      <form id="memo-form">
        <input id="title" placeholder="品名（例：ボールペン）" required maxlength="100" />
        <input id="note" placeholder="メモ（例：残り3本）" maxlength="500" />
        <button type="submit">登録</button>
      </form>

      <p id="status"></p>
      <ul id="memo-list"></ul>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
